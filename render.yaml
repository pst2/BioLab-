services:
  - type: web
    name: biolab-backend
    runtime: python
    rootDir: backend_scaffold
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.14"
      - key: DEBUG
        value: "false"
      - key: NCBI_TIMEOUT
        value: "8"
      - key: NCBI_RETRY_COUNT
        value: "1"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: DATABASE_URL
        value: "sqlite:///./bio_backend.db"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: API_KEYS
        value: "biolab2024"
